<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Chargement" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.b{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop 2.2s cubic-bezier(.34,1.56,.64,1) infinite both}
.b1{animation-delay:0s}.b2{animation-delay:.12s}.b3{animation-delay:.24s}.b4{animation-delay:.36s}.b5{animation-delay:.48s}.b6{animation-delay:.6s}
@keyframes pop{0%{transform:scale(0)}14%{transform:scale(1)}78%{transform:scale(1)}90%{transform:scale(0)}100%{transform:scale(0)}}
@media (prefers-reduced-motion:reduce){.b{animation:none;transform:scale(1)}}
</style>
<rect width="96" height="96" rx="22" fill="#2d2b3d"/>
<rect class="b b1" x="18" y="18" width="18" height="18" rx="4" fill="#fff"/>
<rect class="b b2" x="39" y="18" width="18" height="18" rx="4" fill="#fff"/>
<rect class="b b3" x="60" y="18" width="18" height="18" rx="4" fill="#fff"/>
<rect class="b b4" x="39" y="39" width="18" height="18" rx="4" fill="#fff"/>
<rect class="b b5" x="39" y="60" width="18" height="18" rx="4" fill="#fff" fill-opacity=".6"/>
<rect class="b b6" x="60" y="60" width="18" height="18" rx="4" fill="#f59e0b"/>
</svg>
